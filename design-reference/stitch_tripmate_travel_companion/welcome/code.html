<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&amp;family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "surface-container-high": "#ede8dc",
                "on-background": "#1d1c14",
                "on-secondary": "#ffffff",
                "on-error-container": "#93000a",
                "primary-container": "#1f4d3f",
                "on-tertiary-fixed-variant": "#614000",
                "outline": "#717975",
                "on-primary-fixed-variant": "#214f41",
                "on-tertiary-fixed": "#281800",
                "on-secondary-fixed-variant": "#802901",
                "on-error": "#ffffff",
                "surface-container-low": "#f9f3e7",
                "inverse-primary": "#a1d1be",
                "on-primary-container": "#8dbdab",
                "surface-container": "#f3ede1",
                "primary": "#023629",
                "on-secondary-fixed": "#380d00",
                "inverse-surface": "#333028",
                "ink-text": "#211F1A",
                "on-surface-variant": "#404945",
                "surface": "#fff9ed",
                "on-primary": "#ffffff",
                "primary-fixed-dim": "#a1d1be",
                "error": "#ba1a1a",
                "on-tertiary": "#ffffff",
                "surface-dim": "#dfd9ce",
                "tertiary": "#422b00",
                "ai-sage-tint": "#E8F0EA",
                "error-container": "#ffdad6",
                "surface-variant": "#e8e2d6",
                "tertiary-fixed": "#ffddaf",
                "outline-variant": "#c0c8c3",
                "border-warm-grey": "#D9D4CB",
                "inverse-on-surface": "#f6f0e4",
                "secondary-fixed": "#ffdbcf",
                "on-tertiary-container": "#ddaa59",
                "secondary-container": "#ff8759",
                "surface-tint": "#3a6758",
                "surface-bright": "#fff9ed",
                "card-cream": "#FCFAF4",
                "on-secondary-container": "#712300",
                "on-surface": "#1d1c14",
                "primary-fixed": "#bcedda",
                "tertiary-container": "#5f3f00",
                "muted-text": "#5E594E",
                "secondary": "#a04018",
                "on-primary-fixed": "#002118",
                "surface-container-lowest": "#ffffff",
                "tertiary-fixed-dim": "#f3be6a",
                "background": "#fff9ed",
                "secondary-fixed-dim": "#ffb59a",
                "surface-container-highest": "#e8e2d6"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "spacing": {
                "gutter": "16px",
                "base": "8px",
                "stack-md": "24px",
                "stack-sm": "12px",
                "stack-lg": "40px",
                "container-padding": "20px"
            },
            "fontFamily": {
                "headline-md": ["Fraunces"],
                "headline-lg": ["Fraunces"],
                "mono-price": ["Hanken Grotesk"],
                "label-caps": ["Hanken Grotesk"],
                "display": ["Fraunces"],
                "body-md": ["Hanken Grotesk"],
                "body-sm": ["Hanken Grotesk"],
                "body-lg": ["Hanken Grotesk"],
                "headline-sm": ["Fraunces"]
            },
            "fontSize": {
                "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                "mono-price": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .paper-texture {
            background-image: url("https://www.transparenttextures.com/patterns/felt.png");
            background-blend-mode: multiply;
        }
        .dotted-path {
            stroke-dasharray: 8 8;
            stroke: #D9D4CB;
            fill: none;
            stroke-width: 2;
        }
        .gradient-top-right {
            background: radial-gradient(circle at 100% 0%, rgba(255, 181, 154, 0.25) 0%, transparent 50%);
        }
        .gradient-bottom-left {
            background: radial-gradient(circle at 0% 100%, rgba(232, 240, 234, 0.4) 0%, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-ink-text selection:bg-primary-fixed antialiased overflow-hidden">
<!-- Main Welcome Container -->
<main class="relative flex flex-col items-center justify-between min-h-screen w-full max-w-[390px] mx-auto px-container-padding py-stack-lg overflow-hidden paper-texture">
<!-- Gradient Washes -->
<div class="absolute inset-0 gradient-top-right pointer-events-none"></div>
<div class="absolute inset-0 gradient-bottom-left pointer-events-none"></div>
<!-- Hand-drawn dotted flourish -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<svg class="opacity-60" height="100%" viewbox="0 0 390 844" width="100%" xmlns="http://www.w3.org/2000/svg">
<path class="dotted-path" d="M-20,150 Q150,100 200,300 T420,450"></path>
<path class="dotted-path" d="M300,700 Q150,750 50,600 T-50,400"></path>
</svg>
</div>
<!-- Upper Content Block -->
<div class="relative z-10 w-full mt-24 text-center space-y-base animate-in fade-in slide-in-from-bottom-4 duration-1000">
<h1 class="font-display text-display text-primary tracking-tight">
                Wander<span class="text-secondary">.</span>together
            </h1>
<p class="font-body-lg text-body-lg text-muted-text max-w-[240px] mx-auto">
                One living plan for the whole group.
            </p>
</div>
<!-- Action Block -->
<div class="relative z-10 w-full space-y-stack-sm mb-base animate-in fade-in slide-in-from-bottom-8 duration-1000 delay-300">
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary font-body-md py-4 rounded-xl shadow-lg active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-base group">
                Start a trip
                <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Secondary Action -->
<button class="w-full bg-transparent border-2 border-border-warm-grey text-ink-text font-body-md py-4 rounded-xl active:bg-surface-container-low transition-all duration-200">
                Join with a link
            </button>
<!-- Footer Text -->
<p class="text-center font-label-caps text-label-caps text-muted-text opacity-70 pt-base">
                No app needed for friends you invite.
            </p>
</div>
<!-- Decorative "Journal Notations" -->
<div class="absolute top-[45%] right-gutter opacity-40 -rotate-6 z-0 select-none">
<div class="p-base bg-ai-sage-tint border border-border-warm-grey rounded-lg shadow-sm">
<span class="material-symbols-outlined text-[20px] text-primary block">auto_awesome</span>
</div>
</div>
<div class="absolute bottom-[35%] left-gutter opacity-30 rotate-12 z-0 select-none">
<div class="p-base bg-surface-container border border-border-warm-grey rounded-lg shadow-sm">
<span class="material-symbols-outlined text-[20px] text-secondary block">location_on</span>
</div>
</div>
</main>
<script>
        // Subtle Parallax effect on the background flourishes
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            const svg = document.querySelector('svg');
            if(svg) {
                svg.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

        // Simple button interaction
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.opacity = '0.9';
            });
            btn.addEventListener('touchend', () => {
                btn.style.opacity = '1';
            });
        });
    </script>
</body></html>
