<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&amp;family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "surface-container-lowest": "#0f0e0b",
                "surface-container-highest": "#363531",
                "on-error": "#690005",
                "on-primary-fixed": "#002019",
                "error-container": "#93000a",
                "inverse-primary": "#006b58",
                "secondary-container": "#7f301b",
                "secondary-fixed": "#ffdbd2",
                "on-secondary-container": "#ffa087",
                "inverse-on-surface": "#32302d",
                "surface-container-high": "#2b2a27",
                "tertiary-container": "#cca72f",
                "secondary-fixed-dim": "#ffb4a1",
                "error": "#ffb4ab",
                "tertiary-fixed-dim": "#e9c349",
                "surface-container": "#211f1c",
                "primary-fixed-dim": "#7fd7be",
                "on-tertiary-container": "#4e3d00",
                "background": "#141310",
                "tertiary": "#e9c349",
                "on-tertiary-fixed": "#241a00",
                "on-primary": "#00382d",
                "surface-container-low": "#1d1b18",
                "primary-container": "#4da68f",
                "on-secondary-fixed": "#3c0800",
                "outline-variant": "#3e4945",
                "secondary": "#ffb4a1",
                "outline": "#88938e",
                "on-surface": "#e6e2dc",
                "on-primary-container": "#00372c",
                "surface-tint": "#7fd7be",
                "on-secondary-fixed-variant": "#7c2e19",
                "on-secondary": "#5d1805",
                "tertiary-fixed": "#ffe088",
                "on-tertiary-fixed-variant": "#574500",
                "on-surface-variant": "#bdc9c4",
                "on-tertiary": "#3c2f00",
                "surface-dim": "#141310",
                "surface-bright": "#3b3935",
                "on-error-container": "#ffdad6",
                "on-background": "#e6e2dc",
                "inverse-surface": "#e6e2dc",
                "surface": "#141310",
                "primary-fixed": "#9bf3d9",
                "primary": "#7fd7be",
                "on-primary-fixed-variant": "#005142",
                "surface-variant": "#363531",
                "ink-text": "#e6e2dc",
                "muted-text": "#bdc9c4",
                "border-warm-grey": "#3e4945"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "spacing": {
                "md": "24px",
                "margin-mobile": "16px",
                "gutter": "16px",
                "base": "8px",
                "xs": "4px",
                "sm": "12px",
                "margin-desktop": "48px",
                "xl": "64px",
                "lg": "40px",
                "container-padding": "20px",
                "stack-md": "24px",
                "stack-sm": "12px",
                "stack-lg": "40px"
            },
            "fontFamily": {
                "label-md": ["Hanken Grotesk"],
                "headline-md": ["Fraunces"],
                "body-md": ["Hanken Grotesk"],
                "headline-lg-mobile": ["Fraunces"],
                "display-lg": ["Fraunces"],
                "headline-lg": ["Fraunces"],
                "caption": ["Hanken Grotesk"],
                "body-lg": ["Hanken Grotesk"],
                "display": ["Fraunces"],
                "label-caps": ["Hanken Grotesk"]
            },
            "fontSize": {
                "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .paper-texture {
            background-image: url("https://www.transparenttextures.com/patterns/felt.png");
            background-blend-mode: multiply;
        }
        .dotted-path {
            stroke-dasharray: 8 8;
            stroke: #3e4945;
            fill: none;
            stroke-width: 2;
        }
        .gradient-top-right {
            background: radial-gradient(circle at 100% 0%, rgba(127, 48, 27, 0.25) 0%, transparent 50%);
        }
        .gradient-bottom-left {
            background: radial-gradient(circle at 0% 100%, rgba(0, 107, 88, 0.4) 0%, transparent 50%);
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface selection:bg-primary-container antialiased overflow-hidden">
<!-- Main Welcome Container -->
<main class="relative flex flex-col items-center justify-between min-h-screen w-full max-w-[390px] mx-auto px-container-padding py-stack-lg overflow-hidden paper-texture">
<!-- Gradient Washes -->
<div class="absolute inset-0 gradient-top-right pointer-events-none"></div>
<div class="absolute inset-0 gradient-bottom-left pointer-events-none"></div>
<!-- Hand-drawn dotted flourish -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<svg class="opacity-30" height="100%" viewbox="0 0 390 844" width="100%" xmlns="http://www.w3.org/2000/svg">
<path class="dotted-path" d="M-20,150 Q150,100 200,300 T420,450"></path>
<path class="dotted-path" d="M300,700 Q150,750 50,600 T-50,400"></path>
</svg>
</div>
<!-- Upper Content Block -->
<div class="relative z-10 w-full mt-24 text-center space-y-base animate-in fade-in slide-in-from-bottom-4 duration-1000">
<h1 class="font-display text-display text-on-surface tracking-tight">
                Wander<span class="text-secondary">.</span>together
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[240px] mx-auto">
                One living plan for the whole group.
            </p>
</div>
<!-- Action Block -->
<div class="relative z-10 w-full space-y-stack-sm mb-base animate-in fade-in slide-in-from-bottom-8 duration-1000 delay-300">
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-body-md py-4 rounded-xl shadow-lg active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-base group">
                Start a trip
                <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Secondary Action -->
<button class="w-full bg-transparent border-2 border-border-warm-grey text-on-surface font-body-md py-4 rounded-xl active:bg-surface-container-low transition-all duration-200">
                Join with a link
            </button>
<!-- Footer Text -->
<p class="text-center font-label-caps text-label-caps text-on-surface-variant opacity-70 pt-base">
                No app needed for friends you invite.
            </p>
</div>
<!-- Decorative "Journal Notations" -->
<div class="absolute top-[45%] right-gutter opacity-40 -rotate-6 z-0 select-none">
<div class="p-base bg-surface-container-highest border border-outline-variant rounded-lg shadow-sm">
<span class="material-symbols-outlined text-[20px] text-primary block">auto_awesome</span>
</div>
</div>
<div class="absolute bottom-[35%] left-gutter opacity-30 rotate-12 z-0 select-none">
<div class="p-base bg-surface-container border border-outline-variant rounded-lg shadow-sm">
<span class="material-symbols-outlined text-[20px] text-secondary block">location_on</span>
</div>
</div>
</main>
<script>
        // Subtle Parallax effect on the background flourishes
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            const svg = document.querySelector('svg');
            if(svg) {
                svg.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

        // Simple button interaction
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.opacity = '0.9';
            });
            btn.addEventListener('touchend', () => {
                btn.style.opacity = '1';
            });
        });
    </script>
</body></html>
