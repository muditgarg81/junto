<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Junto — No Connection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #faf6f1;
      font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: env(safe-area-inset-top, 24px) 32px env(safe-area-inset-bottom, 32px);
      text-align: center;
      gap: 0;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      background: #f0ebe4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .icon-wrap svg {
      width: 44px;
      height: 44px;
    }

    h1 {
      font-size: 1.625rem;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    h1 span {
      color: #c85c38;
    }

    p {
      font-size: 0.9375rem;
      color: #666;
      max-width: 260px;
      line-height: 1.55;
      margin-bottom: 40px;
    }

    button {
      background: #1f4d3f;
      color: #faf6f1;
      border: none;
      border-radius: 14px;
      padding: 16px 40px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      min-width: 200px;
      transition: opacity 0.15s;
    }

    button:active { opacity: 0.8; }

    .wordmark {
      font-size: 1.125rem;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: -0.02em;
      margin-bottom: 48px;
      opacity: 0.35;
    }

    .wordmark span { color: #c85c38; }
  </style>
</head>
<body>

  <div class="wordmark">Junto<span>.</span></div>

  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 6s2.5-3 11-3 11 3 11 3" stroke="#c85c38" stroke-width="1.75" stroke-linecap="round"/>
      <path d="M5 10s1.8-2 7-2 7 2 7 2" stroke="#c85c38" stroke-width="1.75" stroke-linecap="round"/>
      <path d="M9 14s.8-1 3-1 3 1 3 1" stroke="#c85c38" stroke-width="1.75" stroke-linecap="round"/>
      <circle cx="12" cy="18" r="1.25" fill="#c85c38"/>
      <line x1="3" y1="3" x2="21" y2="21" stroke="#1a1a1a" stroke-width="1.75" stroke-linecap="round"/>
    </svg>
  </div>

  <h1>No internet<br/>connection<span>.</span></h1>
  <p>Check your Wi-Fi or mobile data, then try again.</p>

  <button onclick="window.location.reload()">Retry</button>

</body>
</html>
